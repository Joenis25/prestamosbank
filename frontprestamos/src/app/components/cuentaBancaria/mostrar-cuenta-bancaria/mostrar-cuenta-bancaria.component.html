<p-card class="w-12 h-full">
    <ng-template pTemplate="header">

        <div class="flex justify-content-between flex-wrap">
            <h3 class="ml-4">
                Registro de CuentaBancaria
            </h3>
            <div class="mt-2 mr-2">
                <a 
                  pButton 
                  pRipple
                  label="Crear CuentaBancaria" 
                  icon="pi pi-user-plus"
                  class="bg-cyan-600"
                  [routerLink]="['/cuentas/nuevo']">
                </a>


            </div>

        </div>
    </ng-template>
    <p>
        <p-table [value]="cuentaBancaria">
            <ng-template pTemplate="header">
                <tr>
                    <th>clienteId</th>
                    <th>numeroCuenta</th>
                    <th>tipoCuenta</th>
                    <th>saldo</th>
                    <th class="flex justify-content-center flex-wrap">Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-cuentaBancaria>
                <tr>
                    <td>{{ cuentaBancaria.clienteId }}</td>
                    <td>{{ cuentaBancaria.numeroCuenta }}</td>
                    <td>{{ cuentaBancaria.tipoCuenta }}</td>
                    <td>{{ cuentaBancaria.saldo }}</td>
                    <td>
                        <button 
                        pButton 
                            pRipple
                            icon="pi pi-print"
                            class="bg-cyan-600  mr-1"
                        >

                        </button>
                        <a 
                            pButton 
                            pRipple
                            icon="pi pi-sync"
                            severity="warning"
                            class="mr-1"
                            [routerLink]="['/cuentas/edit', cuentaBancaria.id]">
                        </a>

                        <button 
                            pButton 
                            pRipple
                            severity="danger"
                            icon="pi pi-eraser"
                            class="mr-1"
                            (click)="eliminar(cuentaBancaria.id)"
                        >

                        </button>
                    </td>

                </tr>
            </ng-template>
        </p-table>
    </p>

</p-card>
